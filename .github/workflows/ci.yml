# Testes a cada PR e a cada push na main. Repositório público: os minutos do GitHub Actions são gratuitos.
name: Testes

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Build sem as variáveis do Supabase: o teste de fumaça joga no modo offline.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-do-teste
          path: test-results/
          retention-days: 7
      - name: Postgres 16 com pgTAP (testes de banco)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-pgtap
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: npm run test:db
